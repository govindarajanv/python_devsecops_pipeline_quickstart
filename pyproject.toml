[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["frontend", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.bandit]
exclude_dirs = ["tests", "frontend", ".venv", "venv"]
skips = ["B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
