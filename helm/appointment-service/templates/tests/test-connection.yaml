apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "appointment-service.fullname" . }}-test-connection"
  labels:
    {{- include "appointment-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '--spider'
        - '--timeout=5'
        - 'http://{{ include "appointment-service.fullname" . }}:{{ .Values.service.port }}/health'
  restartPolicy: Never
