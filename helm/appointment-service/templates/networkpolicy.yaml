apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appointment-service.fullname" . }}-policy
  labels:
    {{- include "appointment-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "appointment-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the ingress controller or other namespaces marked accordingly.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # Allow DNS and outbound connections to the bundled Redis service.
    - to:
        - podSelector:
            matchLabels:
              {{- include "appointment-service.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
