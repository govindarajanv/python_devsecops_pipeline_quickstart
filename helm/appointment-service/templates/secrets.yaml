{{- $password := .Values.redis.password | default (randAlphaNum 16) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appointment-service.fullname" . }}
  labels:
    {{- include "appointment-service.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ $password | b64enc | quote }}
