# Development overlay for Minikube.
# Usage: helm upgrade --install appointment-service ./helm/appointment-service -f helm/appointment-service/values-dev.yaml

replicaCount: 1

image:
  repository: ghcr.io/govindarajanv/appointment-service
  tag: sha-3e02136392a7
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000

ingress:
  enabled: false

autoscaling:
  enabled: false

redis:
  persistence:
    enabled: false

resources:
  limits:
    cpu: "300m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"
