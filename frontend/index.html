<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointment Booking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f6f8; color: #1c2b36; line-height: 1.5;
    }
    header {
      background: linear-gradient(90deg, #0f766e, #0e7490);
      color: #fff; padding: 24px 32px;
    }
    header h1 { font-size: 1.4rem; }
    header p { opacity: 0.85; font-size: 0.9rem; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; }
    .card h2 { font-size: 1rem; margin-bottom: 12px; color: #0f766e; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    label { display: flex; flex-direction: column; font-size: 0.8rem; font-weight: 600; }
    input, select { margin-top: 4px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button {
      padding: 10px 16px; border: 0; border-radius: 6px; cursor: pointer;
      font-weight: 600; background: #0f766e; color: #fff;
    }
    button.secondary { background: #475569; }
    button.danger { background: #b91c1c; }
    button.small { padding: 6px 10px; font-size: 0.8rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; }
    .badge.scheduled { background: #e0f2fe; color: #075985; }
    .badge.completed { background: #dcfce7; color: #166534; }
    .badge.cancelled { background: #fee2e2; color: #991b1b; }
    .actions { display: flex; gap: 6px; }
    #message { padding: 12px; border-radius: 6px; display: none; font-size: 0.9rem; }
    #message.ok { display: block; background: #dcfce7; color: #166534; }
    #message.err { display: block; background: #fee2e2; color: #991b1b; }
    .empty { text-align: center; color: #64748b; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Appointment Booking</h1>
    <p>Fullstack CRUD demo &mdash; schedule, update and cancel physician appointments.</p>
  </header>

  <main>
    <div id="message"></div>

    <section class="card">
      <h2>Book a new appointment</h2>
      <form id="create-form">
        <label>Patient name<input type="text" name="patient_name" required maxlength="100" /></label>
        <label>Physician<input type="text" name="physician" required maxlength="100" /></label>
        <label>Date<input type="date" name="appointment_date" required /></label>
        <label>Time slot<input type="time" name="time_slot" required /></label>
        <label>Reason<input type="text" name="reason" required maxlength="500" /></label>
        <button type="submit">Create appointment</button>
      </form>
    </section>

    <section class="card">
      <h2>Appointments</h2>
      <table>
        <thead>
          <tr>
            <th>Patient</th><th>Physician</th><th>Date</th><th>Time</th>
            <th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="appointments-body"></tbody>
      </table>
      <div class="empty" id="empty-row">No appointments yet. Create one above.</div>
    </section>
  </main>

  <script>
    const body = document.getElementById("appointments-body");
    const emptyRow = document.getElementById("empty-row");
    const message = document.getElementById("message");

    function showMessage(text, ok) {
      message.textContent = text;
      message.className = ok ? "ok" : "err";
      setTimeout(() => { message.style.display = "none"; }, 4000);
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || res.statusText);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function load() {
      const items = await api("/api/appointments");
      emptyRow.style.display = items.length ? "none" : "block";
      body.innerHTML = items.map((a) => `
        <tr data-id="${a.id}">
          <td>${escapeHtml(a.patient_name)}</td>
          <td>${escapeHtml(a.physician)}</td>
          <td>${escapeHtml(a.appointment_date)}</td>
          <td>${escapeHtml(a.time_slot)}</td>
          <td><span class="badge ${a.status}">${escapeHtml(a.status)}</span></td>
          <td>
            <div class="actions">
              <button class="small secondary" onclick="setStatus('${a.id}', 'completed')">Complete</button>
              <button class="small danger" onclick="remove('${a.id}')">Delete</button>
            </div>
          </td>
        </tr>`).join("");
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      try {
        await api("/api/appointments", { method: "POST", body: JSON.stringify(data) });
        showMessage("Appointment created successfully.", true);
        e.target.reset();
        await load();
      } catch (err) {
        showMessage(err.message, false);
      }
    });

    window.setStatus = async (id, status) => {
      try {
        await api(`/api/appointments/${id}`, { method: "PUT", body: JSON.stringify({ status }) });
        await load();
      } catch (err) {
        showMessage(err.message, false);
      }
    };

    window.remove = async (id) => {
      try {
        await api(`/api/appointments/${id}`, { method: "DELETE" });
        await load();
      } catch (err) {
        showMessage(err.message, false);
      }
    };

    load().catch((err) => showMessage(err.message, false));
  </script>
</body>
</html>
