name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/appointment-service
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1. Secret Scanning (Gitleaks)
  # -------------------------------------------------------------------------
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # -------------------------------------------------------------------------
  # 2. Pre-commit (linters, formatters, secret detector, bandit, pip-audit)
  # -------------------------------------------------------------------------
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  # -------------------------------------------------------------------------
  # 3. Unit tests with coverage
  # -------------------------------------------------------------------------
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  # 4. SAST (SonarCloud)
  # -------------------------------------------------------------------------
  sast:
    name: SAST (SonarCloud)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download coverage from tests job
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # -------------------------------------------------------------------------
  # 5. SCA (Software Composition Analysis)
  # -------------------------------------------------------------------------
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit dependency scan
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  # -------------------------------------------------------------------------
  # 6. SBOM generation (CycloneDX)
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

      - name: Upload SBOM to dependency track (optional)
        if: false
        run: echo "Integrate Dependency-Track upload here"

  # -------------------------------------------------------------------------
  # 7. License compliance check
  # -------------------------------------------------------------------------
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies and license tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses

      - name: Generate license report
        run: pip-licenses --format=csv --output-file=licenses.csv

      - name: Enforce license policy
        run: python scripts/license_check.py licenses.csv

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: licenses.csv
          retention-days: 30

  # -------------------------------------------------------------------------
  # 8. IaC security scan (Helm chart)
  # -------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint + IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint
        run: helm lint helm/appointment-service

      - name: Helm template (render manifests)
        run: |
          helm template appointment-service helm/appointment-service \
            -f helm/appointment-service/values-dev.yaml > /tmp/rendered.yaml

      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: helm/appointment-service
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH

      - name: Upload IaC SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif

  # -------------------------------------------------------------------------
  # 9. Container image build + vulnerability scan
  # -------------------------------------------------------------------------
  build-and-scan:
    name: Build Image + Scan
    runs-on: ubuntu-latest
    needs: [gitleaks, pre-commit, sast, sca, license-check, helm-lint]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.set-image-ref.outputs.ref }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image reference
        id: set-image-ref
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          REF="${{ env.IMAGE_NAME }}:${TAG}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Building and scanning: ${REF}"

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.set-image-ref.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.set-image-ref.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library

      - name: Upload Trivy image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

  # -------------------------------------------------------------------------
  # 10. Aggregate security gate (protect branch status check)
  # -------------------------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [gitleaks, pre-commit, sast, sca, sbom, license-check, helm-lint, build-and-scan]
    if: always()
    steps:
      - name: Check all security checks passed
        run: |
          json='${{ toJson(needs) }}'
          for key in $(echo "$json" | jq -r 'keys[]'); do
            result=$(echo "$json" | jq -r ".\"$key\".result")
            if [ "$result" != "success" ]; then
              echo "❌ $key failed with result: $result"
              exit 1
            fi
          done
          echo "✅ All DevSecOps checks passed."
