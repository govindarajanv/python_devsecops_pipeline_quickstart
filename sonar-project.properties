# SonarCloud configuration
sonar.organization=<YOUR-ORG-KEY>
sonar.projectKey=<YOUR-PROJECT-KEY>
sonar.projectName=appointment-service
sonar.sources=app,frontend
sonar.tests=tests
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Python test + coverage reporting
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.python.pylint.reportPaths=pylint-report.txt

# Exclude generated / vendored code
sonar.exclusions=**/__pycache__/**,**/tests/**,**/.venv/**,**/venv/**,**/*.min.js

# Quality gate blocks merge on failure (enforced via the workflow job)
sonar.qualitygate.wait=true
